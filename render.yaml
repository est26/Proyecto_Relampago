databases:
  - name: sprintcuc-db
    plan: free
    databaseName: sprintcuc
    region: oregon

services:
  - type: web
    name: sprintcuc
    runtime: node
    plan: free
    region: oregon          # debe coincidir con la region de la base
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sprintcuc-db
          property: connectionString   # Render inyecta la URL interna
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
